services:
  seerr-request-manager:
    build: .
    ports:
      - "5656:3000"
    environment:
      - PORT=3000
      - SEERR_URL=http://10.0.0.134:5055
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-http://10.0.0.134:5656}
      - NODE_ENV=production
      - LOG_LEVEL=info
    volumes:
      - seerr-approval-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');http.get('http://localhost:3000/health',(r)=>{process.exit(r.statusCode===200?0:1);}).on('error',()=>process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  seerr-approval-data:
